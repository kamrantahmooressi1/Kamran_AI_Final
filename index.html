<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamran Tahmooressi | Economics & Sustainability Portfolio</title>
    <meta name="description" content="Professional portfolio of Kamran Tahmooressi, specializing in Economics, Sustainability, and AI Strategy. Updated April 30, 2026.">
    <meta name="author" content="Kamran Tahmooressi">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712; 
            --card-bg: rgba(17, 24, 39, 0.8);
            --accent: #3b82f6;
            --purple: #a855f7;
            --text: #ffffff;
            --text-dim: #9ca3af;
            --border: rgba(59, 130, 246, 0.2);
            --success: #10b981;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        #particle-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #0d1d31 0%, #030712 100%);
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(168, 85, 247, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168, 85, 247, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(3, 7, 18, 0.5) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* Ticker + Scroll HUD */
        .header-nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
        }

        .ticker-wrap {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            overflow: hidden;
            height: 45px;
            display: flex;
            align-items: center;
        }

        .scroll-progress-container {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.05);
        }

        .scroll-progress-bar {
            height: 100%;
            background: linear-gradient(to right, var(--accent), var(--purple));
            width: 0%;
            transition: width 0.1s ease;
            box-shadow: 0 0 10px var(--accent);
        }

        .ticker {
            display: flex;
            white-space: nowrap;
            animation: ticker 60s linear infinite;
        }

        .ticker:hover { animation-play-state: paused; }

        .ticker-item {
            padding: 0 50px;
            color: var(--success);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .ticker-item:hover { color: var(--text); }

        .ticker-dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; box-shadow: 0 0 8px var(--success); }

        @keyframes ticker {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-100%); }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 140px 20px;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 100px;
        }

        .hero-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent);
            margin-bottom: 24px;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
        }

        h1 { font-size: 4rem; margin: 0; font-weight: 800; letter-spacing: -0.05em; }
        .subtitle { color: var(--accent); font-weight: 600; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.25em; margin-top: 10px; }

        section { margin-bottom: 120px; }
        h2 { border-left: 5px solid var(--accent); padding-left: 20px; margin-bottom: 45px; font-size: 2rem; font-weight: 800; }

        .badge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 80px;
        }

        .badge-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .badge-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            background: rgba(59, 130, 246, 0.08);
        }

        .badge-icon {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent);
            padding: 15px;
            border-radius: 15px;
            display: flex;
        }

        .badge-text h4 { margin: 0; font-size: 1.1rem; color: var(--text); }
        .badge-text p { margin: 0; font-size: 0.9rem; color: var(--text-dim); }

        .class-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .class-header {
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .class-content {
            max-height: 0;
            padding: 0 30px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-dim);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        .class-box.active .class-content {
            max-height: 600px;
            padding-bottom: 30px;
        }

        .class-box.active { border-color: var(--accent); }

        .exp-item {
            margin-bottom: 60px;
            padding-left: 30px;
            border-left: 2px solid var(--border);
            position: relative;
        }

        .exp-item::before {
            content: '';
            position: absolute;
            left: -7px; top: 0;
            width: 12px; height: 12px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        footer { text-align: center; padding: 80px; opacity: 0.6; font-size: 0.9rem; border-top: 1px solid var(--border); }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [activeClass, setActiveClass] = useState(null);
            const [news, setNews] = useState([
                { title: "WORLD RECORD: LONGI HIBC SOLAR CELLS HIT 28.13% EFFICIENCY", link: "https://www.renewable-energy-industry.com/news/longi-sets-new-world-record-efficiency-for-hibc-solar-cells" },
                { title: "INNOVATION: SOLAR-DRIVEN METHOD CONVERTS PLASTIC WASTE TO HYDROGEN", link: "https://scitechdaily.com/plastic-to-fuel-breakthrough-solar-driven-photoreforming-innovation/" },
                { title: "GENERAL MOTORS: 100% RENEWABLE ENERGY FOR ALL U.S. OPERATIONS", link: "https://www.esgtoday.com/gm-achieves-100-renewable-energy-target-for-u-s-operations/" },
                { title: "RENEWABLE GAS: LANDFILL GAS CONVERTED TO RNG IN BRITISH COLUMBIA", link: "https://www.biomassmagazine.com/news/hydron-energy-launches-landfill-gas-to-rng-project" },
                { title: "CARBON CAPTURE: STRATOS FACILITY RAMPS UP AS WORLD'S LARGEST DAC PLANT", link: "https://www.drhanak.com/ccs-turning-point-2026-stratos-facility-scale-up" },
                { title: "POLICY: CALIFORNIA SB 253 MANDATORY EMISSIONS REPORTING COMMENCES", link: "https://www.breatheesg.com/california-sb253-mandatory-emissions-reporting-begins" }
            ]);

            useEffect(() => {
                // Fetch dynamic news
                const fetchNews = async () => {
                    try {
                        const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fnews.google.com%2Frss%2Fsearch%3Fq%3Dsite%3Asustainabilitymag.com%2BOR%2Bsite%3Aesgtoday.com%2BOR%2Bsite%3Aeco-business.com%26hl%3Den-US%26gl%3DUS%26ceid%3DUS%3Aen');
                        const data = await response.json();
                        if (data.status === 'ok' && data.items.length > 0) {
                            const formattedNews = data.items.slice(0, 10).map(item => ({
                                title: item.title.split(' - ')[0].toUpperCase(),
                                link: item.link
                            }));
                            setNews(formattedNews);
                        }
                    } catch (error) {
                        console.error("Error fetching news:", error);
                    }
                };

                fetchNews();
                
                const canvas = document.getElementById('particle-canvas');
                const ctx = canvas.getContext('2d');
                let points = [];
                let meshPulses = [];
                let particles = [];
                let shapes = [];
                let animationId;

                const resize = () => { 
                    canvas.width = window.innerWidth; 
                    canvas.height = window.innerHeight; 
                    initMesh();
                };

                const initMesh = () => {
                    points = [];
                    meshPulses = [];
                    const spacing = 150;
                    const rows = Math.ceil(canvas.height / spacing) + 1;
                    const cols = Math.ceil(canvas.width / spacing) + 1;

                    for (let y = 0; y < rows; y++) {
                        for (let x = 0; x < cols; x++) {
                            points.push({
                                x: x * spacing + (Math.random() - 0.5) * spacing * 0.7,
                                y: y * spacing + (Math.random() - 0.5) * spacing * 0.7,
                                neighbors: []
                            });
                        }
                    }

                    // Connect points to form triangles
                    for (let i = 0; i < points.length; i++) {
                        for (let j = i + 1; j < points.length; j++) {
                            const dist = Math.hypot(points[i].x - points[j].x, points[i].y - points[j].y);
                            if (dist < spacing * 1.6) {
                                points[i].neighbors.push(points[j]);
                                points[j].neighbors.push(points[i]);
                            }
                        }
                    }

                    for (let i = 0; i < 20; i++) meshPulses.push(new MeshPulse());
                };

                class MeshPulse {
                    constructor() { this.init(); }
                    init() {
                        this.currentPoint = points[Math.floor(Math.random() * points.length)];
                        this.targetPoint = this.currentPoint.neighbors[Math.floor(Math.random() * this.currentPoint.neighbors.length)];
                        this.progress = 0;
                        this.speed = Math.random() * 0.015 + 0.005;
                    }
                    update() {
                        if (!this.targetPoint) { this.init(); return; }
                        this.progress += this.speed;
                        if (this.progress >= 1) {
                            this.currentPoint = this.targetPoint;
                            this.targetPoint = this.currentPoint.neighbors[Math.floor(Math.random() * this.currentPoint.neighbors.length)];
                            this.progress = 0;
                        }
                    }
                    draw() {
                        if (!this.targetPoint) return;
                        const x = this.currentPoint.x + (this.targetPoint.x - this.currentPoint.x) * this.progress;
                        const y = this.currentPoint.y + (this.targetPoint.y - this.currentPoint.y) * this.progress;
                        
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                        ctx.fillStyle = '#a855f7';
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#a855f7';
                        ctx.fill();
                        ctx.restore();
                    }
                }

                class Shape {
                    constructor() { this.init(); }
                    init() {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.size = Math.random() * 15 + 5;
                        this.speedX = Math.random() * 0.2 - 0.1;
                        this.speedY = Math.random() * 0.2 - 0.1;
                        this.alpha = Math.random() * 0.2 + 0.05;
                        this.type = Math.floor(Math.random() * 3);
                        this.rotation = Math.random() * Math.PI * 2;
                        this.rotSpeed = Math.random() * 0.01 - 0.005;
                    }
                    update() {
                        this.x += this.speedX; this.y += this.speedY;
                        this.rotation += this.rotSpeed;
                        if (this.x < -50) this.x = canvas.width + 50;
                        if (this.x > canvas.width + 50) this.x = -50;
                        if (this.y < -50) this.y = canvas.height + 50;
                        if (this.y > canvas.height + 50) this.y = -50;
                    }
                    draw() {
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.rotate(this.rotation);
                        ctx.strokeStyle = `rgba(168, 85, 247, ${this.alpha})`;
                        ctx.lineWidth = 2;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#a855f7';
                        ctx.beginPath();
                        if (this.type === 0) ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                        else if (this.type === 1) ctx.rect(-this.size/2, -this.size/2, this.size, this.size);
                        else {
                            ctx.moveTo(0, -this.size/2);
                            ctx.lineTo(this.size/2, this.size/2);
                            ctx.lineTo(-this.size/2, this.size/2);
                            ctx.closePath();
                        }
                        ctx.stroke();
                        ctx.restore();
                    }
                }

                class Particle {
                    constructor() { this.init(); }
                    init() {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.size = Math.random() * 2 + 0.5;
                        this.speedX = Math.random() * 0.4 - 0.2;
                        this.speedY = Math.random() * 0.4 - 0.2;
                        this.alpha = Math.random() * 0.3 + 0.1;
                    }
                    update() {
                        this.x += this.speedX; this.y += this.speedY;
                        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
                    }
                    draw() {
                        ctx.fillStyle = `rgba(168, 85, 247, ${this.alpha})`;
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                    }
                }

                for(let i=0; i<80; i++) particles.push(new Particle());
                for(let i=0; i<15; i++) shapes.push(new Shape());

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // Draw Mesh Lines
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(168, 85, 247, 0.15)';
                    ctx.lineWidth = 1;
                    points.forEach(p => {
                        p.neighbors.forEach(n => {
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(n.x, n.y);
                        });
                    });
                    ctx.stroke();

                    meshPulses.forEach(p => { p.update(); p.draw(); });
                    particles.forEach(p => { p.update(); p.draw(); });
                    shapes.forEach(s => { s.update(); s.draw(); });
                    
                    animationId = requestAnimationFrame(animate);
                };

                const handleScroll = () => {
                    const scrollBar = document.getElementById('scroll-bar');
                    const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                    const scrolled = (winScroll / height) * 100;
                    if (scrollBar) scrollBar.style.width = scrolled + "%";
                };

                window.addEventListener('scroll', handleScroll);
                window.addEventListener('resize', resize);
                resize(); animate();
                setTimeout(() => lucide.createIcons(), 200);

                return () => {
                    cancelAnimationFrame(animationId);
                    window.removeEventListener('scroll', handleScroll);
                    window.removeEventListener('resize', resize);
                };
            }, []);

            const classes = [
                { id: 'MGMT342', name: 'MGMT 342: Managing AI', text: 'Strategic AI integration in business. Developed this professional AI-architected portal using Gemini CLI and completed the high-stakes Gamma case study on AI implementation risks.' },
                { id: 'ECON305', name: 'ECON 305: Microeconomic Business Models', text: 'Applied microeconomic modeling to enterprise logistics. Analyzed Amazon’s delivery infrastructure transition to electric fleets and its long-term impact on operational scalability.' },
                { id: 'SUST401', name: 'SUST 401: Sustainability Continued Development', text: 'Advanced study of development concept models. Explored Banerjee’s frameworks and analyzed the evolution of company shareholder value towards holistic ESG alignment.' }
            ];

            return (
                <div>
                    <div className="header-nav">
                        <div className="ticker-wrap">
                            <div className="ticker">
                                {news.map((item, index) => (
                                    <a key={index} href={item.link} target="_blank" className="ticker-item">
                                        <div className="ticker-dot"></div> {item.title}
                                    </a>
                                ))}
                                {news.map((item, index) => (
                                    <a key={`loop-${index}`} href={item.link} target="_blank" className="ticker-item">
                                        <div className="ticker-dot"></div> {item.title}
                                    </a>
                                ))}
                            </div>
                        </div>
                        <div className="scroll-progress-container">
                            <div id="scroll-bar" className="scroll-progress-bar"></div>
                        </div>
                    </div>
                    
                    <div className="container">
                        <header>
                            <img src="Suit Image.jpg" alt="Kamran" className="hero-img" />
                            <h1>Kamran Tahmooressi</h1>
                            <p className="subtitle">Economics, Sustainability, and Society</p>
                        </header>

                        <section>
                            <h2>Specialized Domains</h2>
                            <div className="badge-grid">
                                <div className="badge-card">
                                    <div className="badge-icon"><i data-lucide="cpu"></i></div>
                                    <div className="badge-text">
                                        <h4>AI Engineering</h4>
                                        <p>Iterative Development & Prompting</p>
                                    </div>
                                </div>
                                <div className="badge-card">
                                    <div className="badge-icon"><i data-lucide="leaf"></i></div>
                                    <div className="badge-text">
                                        <h4>Sustainability</h4>
                                        <p>ESG & Carbon Neutrality</p>
                                    </div>
                                </div>
                                <div className="badge-card">
                                    <div className="badge-icon"><i data-lucide="trending-up"></i></div>
                                    <div className="badge-text">
                                        <h4>Consulting</h4>
                                        <p>Business Models & Strategy</p>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <section>
                            <h2>Coursework Portfolio</h2>
                            {classes.map(cls => (
                                <div key={cls.id} className={`class-box ${activeClass === cls.id ? 'active' : ''}`}>
                                    <div className="class-header" onClick={() => setActiveClass(activeClass === cls.id ? null : cls.id)}>
                                        <span>{cls.name}</span>
                                        <i data-lucide={activeClass === cls.id ? "minus" : "plus"} size="20"></i>
                                    </div>
                                    <div className="class-content"><p>{cls.text}</p></div>
                                </div>
                            ))}
                        </section>

                        <section>
                            <h2>Career Trajectory</h2>
                            <div className="exp-item">
                                <div style={{display: 'flex', justifyContent: 'space-between'}}>
                                    <h3 style={{margin: 0}}>ECOS Internship</h3>
                                    <span className="exp-date">March 2026 - Present</span>
                                </div>
                                <div style={{color: 'var(--accent)', fontWeight: 600, margin: '5px 0'}}>AGP Substrates</div>
                                <p style={{color: 'var(--text-dim)'}}>Developed core business models and high-impact investor presentations, aligning technological capability with strategic growth initiatives.</p>
                            </div>

                            <div className="exp-item">
                                <div style={{display: 'flex', justifyContent: 'space-between'}}>
                                    <h3 style={{margin: 0}}>Ticket Operations Manager Intern</h3>
                                    <span className="exp-date">March 2026 - Present</span>
                                </div>
                                <div style={{color: 'var(--accent)', fontWeight: 600, margin: '5px 0'}}>Cincinnati Reds</div>
                                <p style={{color: 'var(--text-dim)'}}>Coordinated high-volume ticket operations and fan engagement, maximizing customer value through operational efficiency.</p>
                            </div>

                            <div className="exp-item">
                                <div style={{display: 'flex', justifyContent: 'space-between'}}>
                                    <h3 style={{margin: 0}}>Auto Detailer</h3>
                                    <span className="exp-date">2024 - 2026</span>
                                </div>
                                <div style={{color: 'var(--accent)', fontWeight: 600, margin: '5px 0'}}>Fields BMW</div>
                                <p style={{color: 'var(--text-dim)'}}>Managed distribution of 45+ vehicles, ensuring peak delivery condition and collaborating with sales teams.</p>
                            </div>
                        </section>

                        <footer>
                            Built Independently using Gemini CLI | Kamran Tahmooressi 2026
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
